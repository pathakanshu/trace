<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
<title id="t">How a report becomes an alert in Trace</title>
<desc id="d">An Organization publishes a Source. The Source asserts a Claim. The Claim is about a Person. The Person has a Subscription. The Subscription receives an Alert. Separately, an InvestigationRun cites the Claim: the model labels where the report came from and Jac decides the next step.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#ab7df8"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<rect x="40" y="16" width="340" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="43" font-size="17" font-weight="600" fill="#f0f6fc">Organization</text>
<text x="60" y="64" font-size="13" fill="#9198a1">Police, a hospital, a relief group</text>
<line x1="210.0" y1="82" x2="210.0" y2="121" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="224.0" y="106.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#9198a1">Publishes</text>
<rect x="40" y="124" width="340" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="151" font-size="17" font-weight="600" fill="#f0f6fc">Source</text>
<text x="60" y="172" font-size="13" fill="#9198a1">One published report, kept as written</text>
<line x1="210.0" y1="190" x2="210.0" y2="229" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="224.0" y="214.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#9198a1">Asserts</text>
<rect x="40" y="232" width="340" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="259" font-size="17" font-weight="600" fill="#f0f6fc">Claim</text>
<text x="60" y="280" font-size="13" fill="#9198a1">MISSING, FOUND_SAFE, SEEN_AT_LOCATION</text>
<line x1="210.0" y1="298" x2="210.0" y2="337" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="224.0" y="322.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#9198a1">About</text>
<rect x="40" y="340" width="340" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="367" font-size="17" font-weight="600" fill="#f0f6fc">Person</text>
<text x="60" y="388" font-size="13" fill="#9198a1">Who the claim is about</text>
<line x1="210.0" y1="406" x2="210.0" y2="445" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="224.0" y="430.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#9198a1">HasSubscription</text>
<rect x="40" y="448" width="340" height="64" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="60" y="475" font-size="17" font-weight="600" fill="#f0f6fc">Subscription</text>
<text x="60" y="496" font-size="13" fill="#9198a1">A family member following that person</text>
<line x1="210.0" y1="514" x2="210.0" y2="553" stroke="#656c76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="224.0" y="538.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#9198a1">Receives</text>
<rect x="40" y="556" width="340" height="64" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="60" y="583" font-size="17" font-weight="600" fill="#f0f6fc">Alert</text>
<text x="60" y="604" font-size="13" fill="#9198a1">Written once, by WatchWalker</text>
<line x1="384" y1="264.0" x2="468" y2="264.0" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#b)"/>
<text x="425.0" y="255.0" font-size="12.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#9198a1">cites</text>
<rect x="470" y="216.0" width="258" height="96" rx="10" fill="#271052" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="488" y="244.0" font-size="17" font-weight="600" fill="#f0f6fc">InvestigationRun</text>
<text x="488" y="266.0" font-size="13" fill="#9198a1">Nemotron labels where the report</text>
<text x="488" y="284.0" font-size="13" fill="#9198a1">came from. Jac picks the next step.</text>
<text x="488" y="302.0" font-size="12" font-style="italic" fill="#9198a1">Advisory, stored apart from claims</text>
</g></svg>
