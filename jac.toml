[project]
name = "trace"
version = "0.0.1"
description = "Trace: sourced disaster reports in one incident graph"
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "lyra"
baseColor = "zinc"
theme = "blue"
font = "geist"
radius = "small"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
"@fontsource-variable/geist" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
# Used by Jac's generated client runtime even without forms in the app.
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "1.1.10"
"@hugeicons/core-free-icons" = "4.3.3"
radix-ui = "1.6.7"
class-variance-authority = "0.7.1"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
maplibre-gl = "5.6.1"
topojson-client = "3.1.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "4.3.3"
"@tailwindcss/vite" = "4.3.3"
[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "Trace"
description = "People, places, and evidence connected through their sources."
keywords = "Trace, Jac, disaster reports, provenance"
author = "Trace team"
theme_color = "#dc7702"
og_type = "website"
og_title = "Trace"
og_description = "One incident. Every trace."
og_site_name = "Trace"
[scale]
[scale.microservices]
enabled = false

[jacpack]
name = 'trace-starter-kit'
description = 'Jac IDE snapshot for trace-starter-kit'

[jachammer]
project_id = "prj_0141238bf8de422c819517af5861ac28"
